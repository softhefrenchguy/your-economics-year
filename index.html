<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FDFCF9" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Light or dark before the page draws, so it never flashes the wrong one. Same rule as
      // src/lib/theme.ts: a choice made with the switch wins, otherwise the device setting.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("your-economics-year:theme:v1");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#13171E" : "#FDFCF9";
      })();
    </script>
    <meta
      name="description"
      content="A Year 12 planner for Economics opportunities in the UK — real competitions, tasters and summer schools, with sources and dates you can trust."
    />
    <title>Your Economics Year · Year 12 Economics opportunities</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Econ Year" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless page-view counts, no personal data. -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e537d573c86f44be9ea1a1433442510c"}'></script>
  </body>
</html>
